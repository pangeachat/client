upload_debug_symbols=true
upload_source_maps=true
upload_sources=true
# Adds --wait to every upload, so sentry-cli blocks until Sentry finishes
# processing instead of returning once the bytes are handed over. Without it a
# server-side processing failure never becomes a non-zero exit and the deploy
# stays green with unusable source maps (#8656). Costs deploy time; revert this
# line if update_sentry starts timing out.
wait_for_processing=true
log_level=info
commits=auto
