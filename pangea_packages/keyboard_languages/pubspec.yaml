name: keyboard_languages
description: >-
  Reports the language of every keyboard the user has enabled on the device,
  on iOS and Android.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: chat.pangea.keyboard_languages
        pluginClass: KeyboardLanguagesPlugin
      ios:
        pluginClass: KeyboardLanguagesPlugin
