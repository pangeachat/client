name: QA scope

# Warns when a PR's linked issue hasn't had its testing platforms evaluated.
#
# NON-BLOCKING BY DESIGN — do not add to branch protection without reading
# .github/instructions/qa-labeling.instructions.md first. Merging past this
# warning falls back to all four platform labels, which is the safe outcome,
# so a hard gate would buy nothing and would train everyone to tick the box
# without thinking.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  qa_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Linked issues have an evaluated platform checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Always runs, and exits 0 when it doesn't apply. A job skipped by a
          # job-level `if:` never reports its check at all, which would strand
          # every PR if this were ever promoted to a required check.
          ISSUES=$(gh pr view "$NUMBER" --json closingIssuesReferences \
            -q '.closingIssuesReferences[].number')

          if [ -z "$ISSUES" ]; then
            echo "No linked issue — nothing to evaluate."
            exit 0
          fi

          MISSING=""
          for i in $ISSUES; do
            BODY=$(gh issue view "$i" --json body -q .body | tr -d '\r')
            if printf '%s' "$BODY" \
              | grep -qE '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]*\*\*Evaluated\*\*'; then
              echo "#$i — evaluated."
            else
              MISSING="$MISSING #$i"
            fi
          done

          [ -n "$MISSING" ] || { echo "All linked issues evaluated."; exit 0; }

          {
            echo "### Testing platforms not evaluated"
            echo
            echo "Unticked **Evaluated** on:$MISSING"
            echo
            echo "Tick the platforms in the issue's **TESTING PLATFORMS** section before merging."
            echo "Guidance: \`.github/instructions/qa-labeling.instructions.md\`"
            echo
            echo "Merging anyway is allowed — the issue just gets all four platform labels on close."
            echo "This check reads the *issue* body, so ticking the boxes will not re-run it; re-run it manually if you want it green."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Testing platforms not evaluated for:$MISSING — see the job summary."
          exit 1
