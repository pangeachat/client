name: Release Workflow

# Publishing a GitHub release is what deploys production, matching every other
# Pangea service (deployment.instructions.md). Pushing to `production` only
# records where a release is being cut and deploys nothing. Releases are cut
# against `production` (`gh release create <tag> --target production`), and a
# release event runs this file from the tagged commit — so the copy on
# `production` is the one that runs.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release_workflow
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEB_APP_ENV: ${{ vars.WEB_APP_ENV }}

permissions:
  contents: write # Uploads the web bundle as a release asset

jobs:
  build_web:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # Consumed by update_sentry so the artifacts it uploads carry the same
      # release and dist the running app reports. See the step that sets them.
      sentry_release: ${{ steps.sentry_version.outputs.release }}
      sentry_dist: ${{ steps.sentry_version.outputs.dist }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install nodejs -y
      - uses: moonrepo/setup-rust@ede6de059f8046a5e236c94046823e2af11ca670 # v1
      - run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
      - run: flutter pub get
      # See the note in main_deploy.yaml — same cache, same key scheme.
      - name: Resolve vodozemac version
        id: vodozemac
        run: echo "version=$(yq '.dependencies.flutter_vodozemac' pubspec.yaml | tr -d '^')" >> $GITHUB_OUTPUT
      - name: Cache vodozemac bindings
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: assets/vodozemac/vodozemac_bindings_dart*
          key: vodozemac-bindings-v1-${{ runner.os }}-${{ steps.vodozemac.outputs.version }}-${{ hashFiles('scripts/prepare-web.sh') }}
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - name: Update Website files
        run: |
          echo "$WEB_APP_ENV" > .env
      - name: Resolve Sentry release and dist
        id: sentry_version
        # The build number is what the running app reports to Sentry, as
        # `<pubspec name>@<pubspec version>+<build number>` with the build
        # number also sent as `dist`. sentry_dart_plugin instead defaults both
        # to pubspec's `version:` (`+N`), so until #8413 every source map
        # uploaded to a release no event ever reported, and web frames stayed
        # minified in Sentry. Resolving the stamp once here and feeding it to
        # both the build and the upload is what keeps the two sides equal.
        run: |
          DIST=$(date -u +%d%H%M)
          NAME=$(yq '.name' pubspec.yaml)
          VERSION=$(yq '.version' pubspec.yaml | cut -d'+' -f1)
          echo "dist=$DIST" >> $GITHUB_OUTPUT
          echo "release=$NAME@$VERSION+$DIST" >> $GITHUB_OUTPUT
      - name: Build Release Web
        # UTC ddHHMM stamp, identical scheme in main_deploy.yaml, so staging and
        # production share one sequence instead of each workflow's own run_number
        # (those had drifted to 3890 vs 104). Build-time only — nothing is
        # committed back, and the release tag still reads pubspec's `+N`.
        # Resets monthly, so it identifies a build, never orders one — the
        # BUILD_COMMIT_SHA dart-define is what says which code is running, and
        # Settings shows it next to the version. Same define in main_deploy.yaml
        # and both mobile workflows. See ci.instructions.md.
        run: ./scripts/build-web-versioned-canvaskit.sh --pwa-strategy=none --release --source-maps --build-number=${{ steps.sentry_version.outputs.dist }} --dart-define=BUILD_COMMIT_SHA=${GITHUB_SHA::8}
      - name: Inject build version into index.html
        # Fills the __BUILD_VERSION__ placeholder index.html ships with. That
        # token is the Sentry release for the service-worker killswitch and the
        # `?v=` cache-buster index.html appends to the four asset manifests, so
        # leaving it unsubstituted pins every deploy to one release and one
        # cache key, and browsers keep serving stale manifests. Must run before
        # any step that copies build/web. Identical step in main_deploy.yaml;
        # this workflow went without it until #8245.
        run: |
          VERSION=${GITHUB_SHA::8}
          sed -i "s|__BUILD_VERSION__|$VERSION|g" build/web/index.html
      # The web app fetches /.env from the web root at runtime; it is not a
      # bundled asset, so the build output needs an explicit copy.
      - name: Add env to web root
        run: cp .env build/web/.env
      - name: Publish self-unregistering service worker
        # Overwrites Flutter's empty (--pwa-strategy=none) flutter_service_worker.js
        # so browsers still holding the old offline-first worker evict it. Inert for
        # fresh visitors, who never register a service worker. See the script header.
        run: cp scripts/self_destroying_service_worker.js build/web/flutter_service_worker.js
      - name: Create archive
        run: tar -czf pangeachat-web.tar.gz build/web/
      - name: Upload Web Build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Web Build
          path: pangeachat-web.tar.gz
      - name: Upload files for deploy stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: build/web
      - name: Upload to release
        # Only a release run has a release to attach the bundle to; a
        # workflow_dispatch redeploy skips this and still deploys.
        if: ${{ github.event_name == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" pangeachat-web.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  deploy_web:
    runs-on: ubuntu-latest
    needs: build_web
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      WEBAPP_S3_BUCKET: ${{ vars.WEBAPP_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download web
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: build/web
      - name: Update Website files
        # Rebuild .env here, mirroring main_deploy.yaml: upload-artifact v4
        # defaults include-hidden-files to false, so a .env baked into
        # build/web at build time never survives into the web artifact.
        # Writing it in the deploy job keeps config resolution in the job
        # that owns the environment.
        run: |
          echo "$WEB_APP_ENV" > build/web/.env
          # Production streaming-STT client gate (Environment.liveStreamingSttEnabled),
          # enabled the same way staging does in main_deploy.yaml. The choreo backend
          # gates the actual behavior: while prod streaming is still dark, the session
          # fails pre-`ready` and the recorder falls back to batch (today's behavior),
          # so this is safe to ship ahead of the backend flip.
          echo "LIVE_STREAMING_STT_ENABLED=true" >> build/web/.env
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1
      - name: Deploy to S3
        run: |
          set -e

          # =========================
          # 1. IMMUTABLE ASSETS
          # Safe to cache long-term only if filenames are versioned/content-safe
          # =========================
          aws s3 sync ./build/web s3://$WEBAPP_S3_BUCKET \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude ".env" \
            --exclude "main.dart.js" \
            --exclude "*.part.js" \
            --exclude "flutter.js" \
            --exclude "flutter_bootstrap.js" \
            --exclude "flutter_service_worker.js" \
            --exclude "version.json" \
            --exclude "manifest.json" \
            --exclude "assets/FontManifest.json" \
            --exclude "assets/AssetManifest.bin*" \
            --exclude "assets/fonts/*"

          # =========================
          # 2. FONT FILES
          # Stable names, can change between deploys
          # =========================
          aws s3 sync ./build/web/assets/fonts s3://$WEBAPP_S3_BUCKET/assets/fonts \
            --cache-control "no-cache, must-revalidate"

          # =========================
          # 3. DEFERRED FLUTTER CHUNKS
          # Flutter .part.js filenames are NOT content hashed
          # Must revalidate to avoid stale disk-cache crashes
          # =========================
          aws s3 cp ./build/web s3://$WEBAPP_S3_BUCKET \
            --recursive \
            --exclude "*" \
            --include "*.part.js" \
            --cache-control "no-cache, must-revalidate"

          # =========================
          # 4. FLUTTER RUNTIME ENTRY FILES + .env (config must propagate every deploy)
          # Must always stay fresh
          # =========================
          RUNTIME_FILES=(
            "index.html"
            ".env"
            "main.dart.js"
            "flutter.js"
            "flutter_bootstrap.js"
            "flutter_service_worker.js"
            "version.json"
            "manifest.json"
            "assets/FontManifest.json"
            "assets/AssetManifest.bin"
            "assets/AssetManifest.bin.json"
          )

          # Every entry is required: a missing runtime file is a partial
          # deploy (same silent-failure class the post-deploy smoke exists
          # for, #7862) and must fail the run, not skip quietly.
          for f in "${RUNTIME_FILES[@]}"; do
            [ -f "./build/web/$f" ] \
              || { echo "::error::runtime file $f missing from build output"; exit 1; }
            aws s3 cp "./build/web/$f" \
              "s3://$WEBAPP_S3_BUCKET/$f" \
              --cache-control "no-cache, must-revalidate"
          done
      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "INVALIDATION_ID=$INVALIDATION_ID" >> "$GITHUB_ENV"
      - name: Post-deploy smoke — deep-link files and served scripts
        # The SPA index fallback serves index.html with a 200 for ANY missing
        # path (deep-link design, joining-courses.instructions.md), which
        # turns two loud failures silent: a dropped .well-known file breaks
        # installed-app links invisibly, and a missing build artifact
        # presents as a white screen instead of a 404. This step makes them
        # loud again at deploy time (#7862).
        run: |
          set -e
          BASE="https://app.pangea.chat"
          aws cloudfront wait invalidation-completed \
            --distribution-id $CF_DISTRIBUTION_ID --id "$INVALIDATION_ID"

          # 1. .well-known files are real JSON carrying the app id — not the
          #    SPA fallback's HTML.
          for f in apple-app-site-association assetlinks.json; do
            curl -sf "$BASE/.well-known/$f" \
              | python3 -c "import sys,json; assert 'com.talktolearn.chat' in json.dumps(json.load(sys.stdin))" \
              || { echo "::error::.well-known/$f is missing, invalid JSON, or lacks the app id (SPA fallback?)"; exit 1; }
          done

          # 2. Runtime entry scripts — and the versioned CanvasKit dir this
          #    exact build requests (scripts/build-web-versioned-canvaskit.sh)
          #    — serve as JavaScript, not the SPA shell.
          CK_REV=$(ls build/web/canvaskit)
          for f in flutter.js main.dart.js "canvaskit/$CK_REV/canvaskit.js"; do
            # First non-whitespace byte: canvaskit.js opens with a newline,
            # which a bare `head -c 1` + command substitution would eat.
            head=$(curl -sf "$BASE/$f" | tr -d '[:space:]' | head -c 1)
            [ "$head" != "<" ] && [ -n "$head" ] \
              || { echo "::error::$f served HTML or empty — partial deploy?"; exit 1; }
          done

          # 3. A deep path serves the SPA shell (the fallback is alive).
          curl -sf "$BASE/zz9smoke" | grep -qi "<html\|<base\|flutter" \
            || { echo "::error::deep path did not serve the SPA shell — fallback broken?"; exit 1; }

  notify:
    needs: deploy_web
    if: ${{ github.event_name == 'release' }}
    permissions:
      id-token: write
      contents: read
    # Local workflow — this public repo can't call the private org-wide
    # notify-matrix-deploy.yaml (see header of notify-matrix-build.yml).
    uses: ./.github/workflows/notify-matrix-build.yml
    with:
      service_name: "Pangea Chat Web"
      version: ${{ github.event.release.tag_name }}
      release_body: ${{ github.event.release.body }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_PROD }}

  update_sentry:
    runs-on: ubuntu-latest
    needs: build_web
    environment: production
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_PROJECT: client
      SENTRY_ORG: pangea-chat
      # sentry.properties sets no `release`/`dist`, so sentry_dart_plugin falls
      # back to these (configuration.dart) instead of pubspec's `+N`. Without
      # them the artifacts land on a release nothing reports. See #8413.
      SENTRY_RELEASE: ${{ needs.build_web.outputs.sentry_release }}
      SENTRY_DIST: ${{ needs.build_web.outputs.sentry_dist }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Download web
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: build/web
      - name: Update packages
        run: flutter pub get
      - name: Update sentry
        run: flutter packages pub run sentry_dart_plugin
      - name: Verify Sentry artifacts landed
        # The plugin exits 0 as soon as the upload is handed off
        # (sentry.properties sets wait_for_processing=false), so a clean exit is
        # not evidence that anything landed -- and a release with no source maps
        # is indistinguishable from a healthy one until someone opens a minified
        # stack trace weeks later. See #8656.
        run: ./scripts/verify-sentry-artifacts.sh
